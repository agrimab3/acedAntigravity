name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aced-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, aced, vps]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy on VPS
        run: bash scripts/deploy-vps.sh
