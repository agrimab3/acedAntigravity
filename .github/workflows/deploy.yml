name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to deploy"
        required: true
        default: "backup-oct9"

concurrency:
  group: aced-production
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aced_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aced_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aced_ci
      NEXTAUTH_URL: http://127.0.0.1:3000
      AUTH_SECRET: ci-dummy-auth-secret-not-production
      NEXTAUTH_SECRET: ci-dummy-nextauth-secret-not-production
      AUTH_GOOGLE_ID: ci-dummy-google-id
      AUTH_GOOGLE_SECRET: ci-dummy-google-secret
      MOCK_TEST_AUTH_MODE: google
      MOCK_TEST_PAYMENT_MODE: stripe
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      RESEND_API_KEY: re_ci_dummy
      EMAIL_TEST_TO: ci@example.invalid
      EMAIL_FROM: onboarding@resend.dev
      ADMIN_EMAILS: admin@example.invalid
      CRON_SECRET: ci-dummy-cron-secret
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:all

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/aced-deploy
          chmod 600 ~/.ssh/aced-deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Copy verified release source
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          remote="/home/ubuntu/apps/aced/incoming/${GITHUB_SHA}"
          ssh -i ~/.ssh/aced-deploy "ubuntu@${VPS_HOST}" "mkdir -p '$remote'"
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude '.next' \
            --exclude '.env' --exclude '.env.local' \
            -e 'ssh -i ~/.ssh/aced-deploy' ./ "ubuntu@${VPS_HOST}:$remote/"
          ssh -i ~/.ssh/aced-deploy "ubuntu@${VPS_HOST}" \
            "cd '$remote' && GITHUB_SHA='${GITHUB_SHA}' bash scripts/deploy-vps.sh && rm -rf '$remote'"
